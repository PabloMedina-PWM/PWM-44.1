<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Añadir evento</title>
    <link rel="icon" href="../resources/images/logoimg.png" type="image/icon type">
    <script src="../js/template-adder.js"></script>
    <script src="../js/crud.js"></script>
    <link rel="stylesheet" href="../css/choices.css">
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>


    <link rel="stylesheet" href="../css/content-viewer-pages.css">
</head>
<body>
    <div id="wrapper1">
        <header id="main_header"></header>
        <div id="wrapper2">
            <section id="main_section"></section>
        </div>

        <footer id="main_footer"></footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            setTimeout(() => {
                const newSelectElement = document.getElementById("new-select");
                if (newSelectElement) {
                    // Crear la instancia de Choices
                    const myChoices = new Choices(newSelectElement, {
                        removeItemButton: true,
                        searchEnabled: true,
                        placeholder: true,
                        placeholderValue: "Selecciona los artistas...",
                        noResultsText: "No se encontraron opciones",
                        noChoicesText: "No hay más opciones disponibles",
                        itemSelectText: "Presiona para seleccionar"
                    });

                    // **GUARDAR** la instancia en el propio elemento
                    newSelectElement.choicesInstance = myChoices;
                } else {
                    console.error("El elemento select con id 'new-select' no existe.");
                }
            }, 100);
        });
    </script>
    <script>init('../templates/crud.html','crud_evento');</script>

</body>
</html>
