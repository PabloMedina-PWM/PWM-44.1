<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<div class="centered">
    <h1 id="Title">Dashboard</h1>
    <h2 id="task">Tareas pendientes</h2>
    <div class="table-container">
        <table class="table" id="tasksTable">
            <thead>
            <tr>
                <th>Tarea</th>
                <th>Descripción</th>
                <th>Prioridad</th>
                <th>Fecha límite</th>
            </tr>
            </thead>
            <tbody id="tasksTableBody">
            </tbody>
        </table>
    </div>
    <h2 id="events">Próximos eventos</h2>
    <div class="table-container">
        <table class="table" id="EventsTable">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Recinto</th>
                <th>Fecha</th>
            </tr>
            </thead>
            <tbody id="eventsTableBody">
            </tbody>
        </table>
    </div>

    <div class="buttons">
        <a href="../html/crud_recinto.html"><button class="button">Añadir recinto</button></a>
        <a href="../html/crud_evento.html"><button class="button">Añadir evento</button></a>
        <a href="../html/crud_artista.html"><button class="button">Añadir artista</button></a>
        <a href="../html/crud_tarea.html"><button class="button noadminhide">Añadir tarea</button></a>
        <a href="../html/crud_empleado.html"><button class="button noadminhide">Añadir empleado</button></a>
    </div>
</div>

<script src="../js/dashboard.js"></script>
</body>
</html>
