<h1>Dashboard</h1>
<app-table [mostrarTareas]="true"></app-table>
<app-table [mostrarEventos]="true"></app-table>
<div class="buttons">
  <app-button [mostrarRecinto]="true"></app-button>
  @if (userRole === "Administrador") {
    <app-button [mostrarTarea]="true"></app-button>
    <app-button [mostrarEmpleado]="true"></app-button>
  }
  <app-button [mostrarEventos]="true"></app-button>
  <app-button [mostrarArtista]="true"></app-button>
</div>
